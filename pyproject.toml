[project]
name = "computational-quantum-chemistry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "flempriere", email = "flempriere@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
computational-quantum-chemistry = "computational_quantum_chemistry:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pre-commit-uv>=4.4.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.98",
]
